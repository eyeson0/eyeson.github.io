<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart — EYESON</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="preload">
  <div id="pageLoader" class="loader" aria-hidden="true"><div class="loader-inner"><div class="brand-mark">E</div><div class="loading-line"></div></div></div>
  <div id="cursor" aria-hidden="true"></div>

  <header class="site-header"><div class="logo-wrap"><a href="index.html"><img src="images/eyeson-logo.webp" alt="EYESON" class="logo"></a></div></header>

  <main class="section">
    <h2>Your Cart</h2>
    <div id="cartList" style="display:grid;gap:12px;max-width:900px">
      <!-- JS will populate cart items from localStorage -->
    </div>

    <div style="margin-top:18px;display:flex;gap:12px;align-items:center">
      <div class="muted">Total:</div>
      <div id="cartTotal" class="price">NPR 0</div>
      <a class="btn primary" href="checkout.html">Checkout</a>
    </div>
  </main>

  <footer class="site-footer"><div class="footer-inner"><div class="footer-col"><div class="brand-compact">EYESON</div></div></div><div class="copyright">© 2026 EYESON</div></footer>

  <script src="js/script.js" defer></script>
  <script src="js/cart.js" defer></script>
</body>
</html>
